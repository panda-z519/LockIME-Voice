name: Release


# Tag a commit (`git tag v0.1.3 && git push origin v0.1.3`) and this builds both
# architectures, verifies them, and attaches the installers plus a checksum file
# to the GitHub Release. Publishing is fully automated; see docs/RELEASING.md.
#
# Version numbers come from `project.yml` (MARKETING_VERSION), not from the tag,
# so the tag and the built app can never disagree silently — the "Verify tag
# matches the built version" step below fails the run if they do.

on:
  push:
    tags: ["v*"]
  # A manual run from the Actions tab is always a dry run: it builds and
  # verifies everything and uploads the installers as workflow artifacts. Only a
  # tag push publishes (the publish steps are gated on `refs/tags/`).
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # The installers are ad-hoc signed, so a Release is only trustworthy if the
  # tests behind it passed. Reuse CI's suite rather than trusting the tag's
  # commit to have been tested elsewhere.
  test:
    name: Build & Test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 26
        run: |
          if [ -d /Applications/Xcode_26.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.app
          fi
          xcodebuild -version

      - name: Install tools
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Run the test suite
        run: |
          set -o pipefail
          xcodebuild -project LockIMEVoice.xcodeproj -scheme LockIMEVoice -configuration Debug \
            -derivedDataPath build/DerivedData \
            -destination 'platform=macOS,arch=arm64' \
            test | xcbeautify

  build:
    name: Build ${{ matrix.arch }}
    needs: test
    runs-on: macos-26
    strategy:
      # Both installers must come from the same commit; stop the second build if
      # the first one fails so a partial Release can never be published.
      fail-fast: true
      matrix:
        include:
          - arch: arm64
            destination: "platform=macOS,arch=arm64"
          - arch: x86_64
            destination: "generic/platform=macOS"
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 26
        run: |
          if [ -d /Applications/Xcode_26.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.app
          fi
          xcodebuild -version

      - name: Install tools
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build Release
        run: |
          set -o pipefail
          # Multi-arch builds are suppressed because each installer ships only
          # its own slice (download size); the project defaults to arm64, so the
          # Intel pass has to override both settings explicitly.
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            ARCH_FLAGS="ARCHS=x86_64 ONLY_ACTIVE_ARCH=NO"
          else
            ARCH_FLAGS="ARCHS=arm64"
          fi
          xcodebuild -project LockIMEVoice.xcodeproj -scheme LockIMEVoice -configuration Release \
            -derivedDataPath build/DerivedData \
            -destination '${{ matrix.destination }}' \
            $ARCH_FLAGS \
            build | xcbeautify

      - name: Verify the built app
        id: verify
        run: |
          APP="build/DerivedData/Build/Products/Release/LockIME Voice.app"
          [ -d "$APP" ] || { echo "::error::app not found at $APP"; exit 1; }

          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")
          bundle_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist")
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # The app identity other tooling and the docs rely on.
          [ "$bundle_id" = "com.zhangsiqiang519.LockIMEVoice" ] \
            || { echo "::error::unexpected bundle id: $bundle_id"; exit 1; }

          # Single-arch by design — a fat binary means the arch override was lost.
          archs=$(lipo -archs "$APP/Contents/MacOS/LockIME Voice")
          [ "$archs" = "${{ matrix.arch }}" ] \
            || { echo "::error::expected ${{ matrix.arch }}, got: $archs"; exit 1; }

          # Ad-hoc signature, and specifically WITHOUT get-task-allow: that key
          # marks a build as debuggable and must not ship (see project.yml).
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | grep -q 'Signature=adhoc' \
            || { echo "::error::app is not ad-hoc signed"; exit 1; }
          if codesign -d --entitlements - "$APP" 2>/dev/null | grep -q 'get-task-allow'; then
            echo "::error::app carries get-task-allow (debuggable build)"
            exit 1
          fi

          echo "verified: $bundle_id $version $archs (adhoc, no get-task-allow)"

      - name: Fail if the tag does not match the built version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          built="${{ steps.verify.outputs.version }}"
          [ "$tag_version" = "$built" ] || {
            echo "::error::tag $GITHUB_REF_NAME does not match MARKETING_VERSION $built in project.yml"
            exit 1
          }

      - name: Package DMG
        run: |
          APP="build/DerivedData/Build/Products/Release/LockIME Voice.app"
          version="${{ steps.verify.outputs.version }}"
          scripts/make-dmg.sh "$APP" "build/dmg/LockIME-Voice-$version-${{ matrix.arch }}.dmg"

      - name: Verify the DMG
        run: |
          version="${{ steps.verify.outputs.version }}"
          dmg="build/dmg/LockIME-Voice-$version-${{ matrix.arch }}.dmg"
          [ -f "$dmg" ] || { echo "::error::dmg not found at $dmg"; exit 1; }
          # Mount it and confirm the app inside is the one we verified: catching a
          # bad copy into the image is the whole point of signing the installer.
          mount=$(mktemp -d)
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount" >/dev/null
          trap 'hdiutil detach "$mount" >/dev/null 2>&1 || true' EXIT
          codesign --verify --deep --strict "$mount/LockIME Voice.app"
          inner=$(lipo -archs "$mount/LockIME Voice.app/Contents/MacOS/LockIME Voice")
          [ "$inner" = "${{ matrix.arch }}" ] || { echo "::error::dmg contains $inner"; exit 1; }
          echo "dmg verified: $dmg"

      - name: Write checksums
        run: |
          version="${{ steps.verify.outputs.version }}"
          cd build/dmg
          shasum -a 256 "LockIME-Voice-$version-${{ matrix.arch }}.dmg" \
            > "LockIME-Voice-$version-${{ matrix.arch }}.dmg.sha256"

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: dmg-${{ matrix.arch }}
          path: |
            build/dmg/*.dmg
            build/dmg/*.sha256
          if-no-files-found: error

  publish:
    name: Publish Release
    needs: build
    # A manual run only ever produces artifacts, never a public Release.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download installers
        uses: actions/download-artifact@v6
        with:
          pattern: dmg-*
          merge-multiple: true
          path: dist

      - name: Combine checksums
        run: |
          cd dist
          # One SHA256SUMS.txt covering both installers, so a user can verify a
          # download with a single file (and the release notes link to it).
          cat *.sha256 | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Assemble the release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="docs/release-notes/${version}.md"

          # The notes are written by hand in the tagged commit, so they are
          # reviewable in the same diff as the change they describe. A missing
          # file is a hard failure: publishing a Release with only boilerplate
          # hides what actually changed.
          if [ ! -f "$notes" ]; then
            echo "::error::$notes not found. Add the release notes in the same commit as the version bump."
            exit 1
          fi

          {
            echo "## LockIME Voice ${version}"
            echo
            cat "$notes"
            echo
            echo "---"
            echo
            echo "### Installers"
            echo
            echo "| Architecture | File |"
            echo "|---|---|"
            for arch in arm64 x86_64; do
              echo "| ${arch} | \`LockIME-Voice-${version}-${arch}.dmg\` |"
            done
            echo
            echo "Checksums are listed in \`SHA256SUMS.txt\` in this release's assets."
            echo "Verify a download before opening it:"
            echo
            echo '```sh'
            echo "# put the .dmg and SHA256SUMS.txt in one directory, then:"
            echo "shasum -a 256 -c SHA256SUMS.txt"
            echo '```'
          } > release-body.md

          echo "--- release body ---"
          cat release-body.md

      - name: Create or update the Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # A re-run of the same tag updates the existing Release — assets *and*
          # notes — instead of failing. Decided up front rather than with
          # `create || upload`, which also swallowed real `create` failures.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              dist/*.dmg dist/SHA256SUMS.txt --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --title "LockIME Voice $version" \
              --notes-file release-body.md
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "LockIME Voice $version" \
              --notes-file release-body.md \
              --verify-tag \
              dist/*.dmg dist/SHA256SUMS.txt
          fi

      - name: Summary
        run: |
          {
            echo "### Released $GITHUB_REF_NAME"
            echo
            cat dist/SHA256SUMS.txt
          } >> "$GITHUB_STEP_SUMMARY"
